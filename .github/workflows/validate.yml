name: Validate PowerShell distribution

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: PowerShell 5.1 syntax and integrity
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          foreach ($file in @('AvastTrace.ps1', 'Install.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file).Path,
              [ref]$tokens,
              [ref]$errors
            )
            if (@($errors).Count -ne 0) {
              foreach ($error in $errors) { Write-Host ($error | Out-String) }
              throw "PowerShell syntax errors in $file"
            }
            Write-Host "PASS syntax: $file"
          }

      - name: Verify published collector checksum
        shell: powershell
        run: |
          $line = @(Get-Content -LiteralPath SHA256SUMS.txt |
            Where-Object { $_ -match '^[0-9a-fA-F]{64}\s+\*?AvastTrace\.ps1\s*$' })
          if ($line.Count -ne 1) { throw 'Expected exactly one collector hash entry' }
          $expected = ($line[0] -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath AvastTrace.ps1 -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Checksum mismatch: $actual / $expected" }
          Write-Host "PASS SHA256: $actual"

      - name: Verify incident process lineage (4-level synthetic 4688 chain)
        shell: powershell
        run: |
          & .\AvastTrace.ps1 -Mode SelfTest

      - name: Exercise incident capture with synthetic Avast text
        shell: powershell
        run: |
          # Synthetic log used only on the disposable CI runner.
          $avastLog = Join-Path $env:ProgramData 'AVAST Software\Avast\log'
          New-Item -ItemType Directory -Path $avastLog -Force | Out-Null
          $fixture = Join-Path $avastLog 'avasttrace-ci-fixture.txt'
          $marker = 'IDP.Generic - Behavior Shield conhost.exe - AVASTTRACE_CI_FIXTURE'
          try {
            [IO.File]::WriteAllText($fixture, $marker)
            $when = Get-Date
            & .\AvastTrace.ps1 -Mode Capture -At $when

            $recent = Get-ChildItem (Join-Path $env:ProgramData 'AvastTrace') -Filter 'incident-*.json' |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($null -eq $recent) { throw 'No incident JSON generated' }
            $report = Get-Content -Raw -LiteralPath $recent.FullName | ConvertFrom-Json
            $found = @($report.AvastKeywordMatches |
              Where-Object { $_.Line -match 'AVASTTRACE_CI_FIXTURE' })
            if ($found.Count -ne 1) { throw 'Synthetic Avast alert was not correlated into incident JSON' }
            Write-Host "PASS synthetic capture: $($recent.Name)"
          }
          finally {
            Remove-Item -LiteralPath $fixture -Force -ErrorAction SilentlyContinue
          }

      - name: Exercise pinned bootstrap installer on disposable Windows runner
        shell: powershell
        run: |
          $installed = Join-Path $env:ProgramData 'AvastTrace\AvastTrace.ps1'
          try {
            & .\Install.ps1
            if (-not (Test-Path -LiteralPath $installed)) { throw 'Installer failed to place collector' }

            $expected = ((Get-Content SHA256SUMS.txt | Select-Object -First 1) -split '\s+')[0]
            $actual = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
            if ($actual -ne $expected) { throw 'Installed collector hash mismatch' }

            $task = Get-ScheduledTask -TaskPath '\AvastTrace\' -TaskName 'AvastTrace-Collector'
            if (-not $task) { throw 'Scheduled task missing after install' }
            Write-Host "PASS pinned bootstrap installation: SHA256=$actual Task=$($task.State)"
          }
          finally {
            if (Test-Path -LiteralPath $installed) {
              & $installed -Mode Uninstall
            }
          }
